# Application lifecycle commands.
# Usage: atmos app <build|push|record|up|down|logs|test>

commands:
  - name: app
    description: Build, publish, deploy, and operate the example application
    commands:
      - name: build
        description: Build the application image, optionally using the shared ECR Buildx cache
        working_directory: !repo-root
        flags:
          - name: registry
            type: string
            description: ECR registry that hosts the application image
            default: 068007702576.dkr.ecr.us-east-2.amazonaws.com
          - name: image
            type: string
            description: Fully qualified application image tag to build
            default: 068007702576.dkr.ecr.us-east-2.amazonaws.com/cloudposse-examples/atmos-native-ci:latest
          - name: image-cache
            type: string
            description: Fully qualified Buildx registry cache reference
            default: 068007702576.dkr.ecr.us-east-2.amazonaws.com/cloudposse-examples/atmos-native-ci:buildcache
        steps:
          - name: authenticate to ECR for Buildx cache
            type: shell
            when: ci
            command: atmos aws ecr login --registry "{{ index .Flags "registry" }}"
          - name: build with registry cache
            type: container
            action: build
            provider: docker
            when: ci
            with:
              engine: buildx
              context: app
              dockerfile: Dockerfile
              tags: ['{{ index .Flags "image" }}']
              load: true
              driver:
                name: atmos-native-ci
                provider: docker-container
                opts:
                  image: mirror.gcr.io/moby/buildkit:buildx-stable-1
              cache:
                from:
                  - type: registry
                    ref: '{{ index .Flags "image-cache" }}'
                to:
                  - type: registry
                    ref: '{{ index .Flags "image-cache" }}'
                    mode: max
          - name: build
            type: container
            action: build
            provider: docker
            when: local
            with:
              engine: buildx
              context: app
              dockerfile: Dockerfile
              tags: ['{{ index .Flags "image" }}']
              load: true
              driver:
                name: atmos-native-ci
                provider: docker-container
                opts:
                  image: mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: push
        description: Authenticate to ECR, push the application image, and record it for deployment
        working_directory: !repo-root
        flags:
          - name: registry
            type: string
            description: ECR registry that hosts the application image
            default: 068007702576.dkr.ecr.us-east-2.amazonaws.com
          - name: image
            type: string
            description: Fully qualified application image tag to push and record
            default: 068007702576.dkr.ecr.us-east-2.amazonaws.com/cloudposse-examples/atmos-native-ci:latest
          - name: stack
            type: string
            description: Atmos stack to receive the deployment image
            default: dev
            semantic_type: stack
          - name: store-key
            type: string
            description: Image metadata key within the selected stack
            default: image
        steps:
          - name: authenticate to ECR
            type: shell
            command: atmos aws ecr login --registry "{{ index .Flags "registry" }}"
          - name: push
            type: container
            action: push
            provider: docker
            with:
              image: '{{ index .Flags "image" }}'
          - name: record deployment image
            type: store
            action: write
            with:
              store: image-metadata
              key: '{{ index .Flags "store-key" }}'
              value: '{{ index .Flags "image" }}'
              stack: '{{ index .Flags "stack" }}'
              component: app

      - name: record
        description: Record an already-published application image for deployment
        working_directory: !repo-root
        flags:
          - name: image
            type: string
            description: Fully qualified already-published application image tag to record
            default: 068007702576.dkr.ecr.us-east-2.amazonaws.com/cloudposse-examples/atmos-native-ci:latest
          - name: stack
            type: string
            description: Atmos stack to receive the deployment image
            default: dev
            semantic_type: stack
          - name: store-key
            type: string
            description: Image metadata key within the selected stack
            default: image
        steps:
          - name: record deployment image
            type: store
            action: write
            with:
              store: image-metadata
              key: '{{ index .Flags "store-key" }}'
              value: '{{ index .Flags "image" }}'
              stack: '{{ index .Flags "stack" }}'
              component: app

      - name: up
        description: Start the application locally using Atmos native containers
        steps:
          - name: check for a port 8080 conflict
            type: shell
            on_failure: continue
            output: none
            command: |
              holder=$(docker ps --filter "publish=8080" | tail -n +2 | awk '{print $NF}' | grep -v '^atmos-local-container-app$' || true)
              if [ -n "$holder" ]; then
                exit 1
              fi
          - type: toast
            level: error
            when: failure
            content: "Port 8080 is already in use by another container. Run `docker ps` to find it, then `docker stop <name>` and retry."
          - type: toast
            level: info
            content: "Starting app at http://localhost:8080 (dashboard at http://localhost:8080/dashboard)"
          - atmos container up app -s local

      - name: down
        description: Stop the local application container
        steps:
          - atmos container down app -s local

      - name: logs
        description: Stream local application container logs
        steps:
          - atmos container logs app -s local

      - name: test
        description: Run Go tests
        working_directory: app
        steps:
          - go test -v ./...
